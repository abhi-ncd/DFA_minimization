<!doctype html>
<html lang="en" data-skin="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23FF2A2A%22/><text x=%2250%22 y=%2268%22 font-size=%2256%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-weight=%22900%22 fill=%22%23ffffff%22>δ</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)" />
    <title>DFA Minimizer</title>
    <script>
      // Pick the skin before first paint so Night users don't see a flash of Day.
      (function () {
        var s = null;
        try { s = localStorage.getItem('dfa-skin'); } catch (e) {}
        if (s !== 'day' && s !== 'night') {
          s = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        }
        document.documentElement.dataset.skin = s;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Oswald:wght@500;600&family=Anton&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
